name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get

    - name: Diagnose environment
      run: |
        flutter doctor -v || true
        echo "-- android tree --"
        ls -la android || true
        echo "-- gradle properties --"
        if [ -f android/gradle.properties ]; then cat android/gradle.properties; fi
        echo "-- java version --"
        java -version || true
        echo "-- which gradle --"
        which gradle || true
        echo "-- list gradle wrapper --"
        ls -la android/gradle || true

    - name: Install Gradle (system)
      run: |
        sudo apt-get update -y
        sudo apt-get install -y gradle
        gradle --version || true

    - name: Build Release APK (verbose)
      run: |
        set -o pipefail
        flutter build apk --release -v 2>&1 | tee build_logs.txt

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/apk/release/app-release.apk
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build_logs.txt
        retention-days: 30
